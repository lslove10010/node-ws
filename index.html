<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欢迎访问 | Welcome</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #333;
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
      animation: fadeIn 1.5s ease-out;
    }
    h1 {
      font-size: 3.5em;
      margin-bottom: 20px;
      color: #4a148c;
    }
    p {
      font-size: 1.2em;
      line-height: 1.6;
      margin-bottom: 40px;
      color: #555;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      width: 250px;
      transition: transform 0.3s;
    }
    .card:hover {
      transform: translateY(-10px);
    }
    .card h3 {
      color: #667eea;
    }
    footer {
      margin-top: 50px;
      font-size: 0.9em;
      color: #888;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 768px) {
      h1 { font-size: 2.5em; }
      .cards { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>欢迎来到我的世界</h1>
    <p>一个简洁、优雅的静态页面示例。<br>享受平静与美学的完美结合。</p>
    
    <div class="cards">
      <div class="card">
        <h3>设计</h3>
        <p>现代极简风格，响应式布局。</p>
      </div>
      <div class="card">
        <h3>性能</h3>
        <p>纯静态，无需加载外部资源。</p>
      </div>
      <div class="card">
        <h3>美学</h3>
        <p>渐变背景与柔和动画。</p>
      </div>
    </div>
    
    <footer>&copy; 2025 Your Name. All rights reserved.</footer>
  </div>
</body>
</html>
